%POSITION%<span style="white-space:nowrap; height:45px; " >
<span class="Label" style="vertical-align:top; ">%LABEL%</span> 
				<textarea type="text"
				 id="%ID%" 
				 maxLength="%LNG%" 
				 typeValeur="%TYPEVALEUR%"
				 obligatoire="%OBLIGATOIRE%" 
				 title="%HELP%"
				 
				 %DISABLED%
				 
				 onfocus="document.getElementById('%ID%').maxLength=%LNG%;return %FOCUS%"
				 onChange="%CHANGE%"
				 onBlur="%BLUR%"
				 onKeyDown="%KEYDOWN%"
				 onKeyPress="%KEYPRESS%"
				 onKeyUp="%KEYUP%"
				 
				 style="width:300px;height:40px;color:#000000; " 
				 >%VALUE%</textarea><span id="%ID%DESC" class="Description" >%DESCRIPTION%</span> 
</span>
