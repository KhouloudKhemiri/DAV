<script>
                var worker;

                function startWorker()
                {
                    // Initialize web worker
                    worker = new Worker("/worker/extractNiveauWorker.js");
                }


                function stopWorker() {
                    // Stop the worker
                    worker.terminate();
                }

                function confirmRefresh()

                {
                    stopWorker();
                }
</script>
